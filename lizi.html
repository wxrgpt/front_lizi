<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子特效炫酷页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            background-color: #111;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .content {
            max-width: 800px;
            text-align: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 204, 0.3);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #ccc;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 204, 0.4);
        }

        .color-controls {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .color-option:hover {
            transform: scale(1.2);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #777;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="content">
            <h1>炫酷粒子特效</h1>
            <p>欢迎来到这个动态粒子特效展示页面。这些粒子会根据鼠标移动而产生互动效果，创造出令人惊叹的视觉体验。</p>
            <button class="btn" id="changeEffect">切换效果</button>
            <button class="btn" id="addParticles">增加粒子</button>
            <div class="color-controls">
                <div class="color-option" style="background-color: #ff00cc;" data-color="#ff00cc"></div>
                <div class="color-option" style="background-color: #3333ff;" data-color="#3333ff"></div>
                <div class="color-option" style="background-color: #00ffaa;" data-color="#00ffaa"></div>
                <div class="color-option" style="background-color: #ffaa00;" data-color="#ffaa00"></div>
                <div class="color-option" style="background-color: #ff0066;" data-color="#ff0066"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2025 粒子特效网页演示 | 使用 HTML5 Canvas 制作</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');

            // 设置画布大小为窗口大小
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 粒子设置
            let particlesArray = [];
            const numberOfParticles = 100;
            let hue = 0;
            let effectMode = 1;
            let particleColor = '#ff00cc';

            // 鼠标位置
            const mouse = {
                x: null,
                y: null,
                radius: 150
            };

            // 监听鼠标移动
            window.addEventListener('mousemove', (event) => {
                mouse.x = event.x;
                mouse.y = event.y;
            });

            // 监听窗口大小变化
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                init();
            });

            // 粒子离开视窗后重置
            window.addEventListener('mouseout', () => {
                mouse.x = undefined;
                mouse.y = undefined;
            });

            // 粒子类
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 5 + 1;
                    this.speedX = Math.random() * 3 - 1.5;
                    this.speedY = Math.random() * 3 - 1.5;
                    this.color = particleColor;
                }

                // 更新粒子位置
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    // 检查鼠标附近的粒子
                    if (mouse.x != undefined && mouse.y != undefined) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            const angle = Math.atan2(dy, dx);
                            const force = (mouse.radius - distance) / mouse.radius;

                            if (effectMode === 1) {
                                // 吸引效果
                                this.speedX += force * Math.cos(angle) * 0.1;
                                this.speedY += force * Math.sin(angle) * 0.1;
                            } else {
                                // 排斥效果
                                this.speedX -= force * Math.cos(angle) * 0.1;
                                this.speedY -= force * Math.sin(angle) * 0.1;
                            }
                        }
                    }

                    // 碰撞边界
                    if (this.x < 0 || this.x > canvas.width) {
                        this.speedX = -this.speedX;
                    }
                    if (this.y < 0 || this.y > canvas.height) {
                        this.speedY = -this.speedY;
                    }

                    // 添加一些随机性
                    this.speedX += (Math.random() - 0.5) * 0.1;
                    this.speedY += (Math.random() - 0.5) * 0.1;

                    // 限制速度
                    const maxSpeed = 3;
                    const currentSpeed = Math.sqrt(this.speedX * this.speedX + this.speedY * this.speedY);
                    if (currentSpeed > maxSpeed) {
                        this.speedX = (this.speedX / currentSpeed) * maxSpeed;
                        this.speedY = (this.speedY / currentSpeed) * maxSpeed;
                    }
                }

                // 绘制粒子
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();

                    // 绘制发光效果
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                }

                // 绘制粒子之间的连线
                drawLines() {
                    for (let i = 0; i < particlesArray.length; i++) {
                        const dx = this.x - particlesArray[i].x;
                        const dy = this.y - particlesArray[i].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = this.color;
                            ctx.globalAlpha = 1 - (distance / 100);
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(this.x, this.y);
                            ctx.lineTo(particlesArray[i].x, particlesArray[i].y);
                            ctx.stroke();
                            ctx.globalAlpha = 1;
                        }
                    }
                }
            }

            // 初始化粒子
            function init() {
                particlesArray = [];
                for (let i = 0; i < numberOfParticles; i++) {
                    particlesArray.push(new Particle());
                }
            }

            // 动画循环
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particlesArray.length; i++) {
                    particlesArray[i].update();
                    particlesArray[i].draw();
                    particlesArray[i].drawLines();
                }

                hue += 0.5;
                requestAnimationFrame(animate);
            }

            // 初始化粒子并开始动画
            init();
            animate();

            // 切换效果按钮
            document.getElementById('changeEffect').addEventListener('click', () => {
                effectMode = effectMode === 1 ? 2 : 1;
                if (effectMode === 1) {
                    document.getElementById('changeEffect').textContent = '切换为排斥效果';
                } else {
                    document.getElementById('changeEffect').textContent = '切换为吸引效果';
                }
            });

            // 增加粒子按钮
            document.getElementById('addParticles').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    particlesArray.push(new Particle());
                }
            });

            // 切换颜色
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    particleColor = option.getAttribute('data-color');
                    particlesArray.forEach(particle => {
                        particle.color = particleColor;
                    });
                });
            });
        });
    </script>
</body>
</html>
